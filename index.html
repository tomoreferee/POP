<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eef1f7" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>POP App</title>
    <style>
      html, body {
        /* Light theme: the page itself must be light too, or the browser paints
           a dark strip behind the app when it bounces at the top/bottom. */
        background: #eef1f7;
        color: #1b1f30;
        overscroll-behavior-y: none;
        overscroll-behavior-x: none;
        height: 100%;
        /* Nothing may widen the page itself — the schedule tables scroll inside
           their own containers. Without this a wide table pushes the document
           wider than the screen, which iOS shows as a zoomed-in page on load. */
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
        margin: 0;
        /* Stop iOS from auto-inflating text when it thinks a column is too narrow */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #root {
        height: 100%;
        width: 100%;
        max-width: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior-y: contain;
      }
      *, *::before, *::after { box-sizing: border-box; }
      /* iOS Safari zooms the whole page in when a focused text field is under
         16px, and it stays zoomed afterwards. Keeping text inputs at 16px stops
         that without disabling the user's own pinch-zoom. */
      input[type="text"], input[type="password"], input[type="number"],
      input[type="time"], input:not([type]), textarea {
        font-size: 16px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
